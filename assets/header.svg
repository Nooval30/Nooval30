<svg width="1584" height="396" viewBox="0 0 1584 396" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#111b2e"/>
      <stop offset="100%" stop-color="#0a0f1c"/>
    </linearGradient>

    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6e27a"/>
      <stop offset="45%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6a1f"/>
    </linearGradient>

    <linearGradient id="goldSoft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e9c766" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e9c766" stop-opacity="0.15"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f3d582" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f3d582" stop-opacity="0"/>
    </radialGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>

    <!-- minimalist cavalry (horse + rider) silhouette, facing right -->
    <g id="cavalry">
      <path d="M -28 -4 Q -42 0 -40 14 Q -34 4 -26 2 Z" fill="url(#gold)" opacity="0.8"/>
      <ellipse cx="0" cy="0" rx="30" ry="12" fill="url(#gold)" opacity="0.92"/>
      <path d="M 22 -8 Q 34 -22 44 -18 Q 40 -10 30 -6 Z" fill="url(#gold)" opacity="0.92"/>
      <path d="M -20 8 L -28 26 L -22 26 L -14 10 Z" fill="url(#gold)" opacity="0.85"/>
      <path d="M -8 10 L -12 28 L -6 28 L 0 12 Z" fill="url(#gold)" opacity="0.85"/>
      <path d="M 10 10 L 18 26 L 24 24 L 14 8 Z" fill="url(#gold)" opacity="0.85"/>
      <path d="M 18 6 L 30 20 L 36 16 L 22 2 Z" fill="url(#gold)" opacity="0.85"/>
      <path d="M 4 -10 Q 2 -26 10 -34 Q 16 -26 14 -10 Z" fill="url(#gold)"/>
      <circle cx="11" cy="-38" r="5" fill="url(#gold)"/>
      <line x1="14" y1="-32" x2="40" y2="-58" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- leader variant (Alexander): adds a crest and a raised sword arm -->
    <g id="cavalry-leader">
      <use href="#cavalry"/>
      <path d="M 8 -42 L 11 -50 L 14 -42 Z" fill="url(#gold)"/>
      <line x1="4" y1="-30" x2="-14" y2="-52" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="11" cy="-38" r="16" fill="url(#glow)"/>
    </g>
  </defs>

  <!-- Background -->
  <rect width="1584" height="396" fill="url(#bg)"/>

  <!-- subtle geometric mountain silhouette (Macedonian highlands) -->
  <polygon points="0,396 0,300 180,220 340,300 520,180 700,300 880,240 1050,320 1230,260 1410,330 1584,290 1584,396" fill="#0d1626" opacity="0.8"/>
  <polygon points="0,396 0,340 220,290 460,340 720,280 980,340 1220,300 1450,350 1584,330 1584,396" fill="#0a0f1c"/>

  <!-- thin gold horizon line -->
  <line x1="0" y1="300" x2="1584" y2="300" stroke="url(#gold)" stroke-width="1" opacity="0.25"/>

  <!-- marching cavalry, led by Alexander at the front -->
  <g>
    <use href="#cavalry" transform="translate(160,336) scale(0.32)" opacity="0.35"/>
    <use href="#cavalry" transform="translate(210,338) scale(0.30)" opacity="0.35"/>
    <use href="#cavalry" transform="translate(260,334) scale(0.34)" opacity="0.4"/>

    <use href="#cavalry" transform="translate(340,330) scale(0.42)" opacity="0.5"/>
    <use href="#cavalry" transform="translate(410,332) scale(0.40)" opacity="0.5"/>

    <use href="#cavalry" transform="translate(500,326) scale(0.5)" opacity="0.62"/>
    <use href="#cavalry" transform="translate(580,328) scale(0.48)" opacity="0.62"/>

    <use href="#cavalry" transform="translate(680,320) scale(0.6)" opacity="0.78"/>
    <use href="#cavalry" transform="translate(770,322) scale(0.58)" opacity="0.78"/>

    <use href="#cavalry" transform="translate(870,314) scale(0.7)" opacity="0.9"/>

    <!-- Alexander the Great, leading the charge -->
    <use href="#cavalry-leader" transform="translate(985,300) scale(0.95)" opacity="1"/>
  </g>

  <!-- Vergina Sun glow -->
  <circle cx="792" cy="180" r="150" fill="url(#glow)"/>

  <!-- Vergina Sun emblem (16-ray star), minimalist line style -->
  <g transform="translate(792,180)" filter="url(#softShadow)">
    <!-- outer thin ring -->
    <circle r="86" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.5"/>

    <!-- 16 rays -->
    <g stroke="url(#gold)" stroke-width="3" stroke-linecap="round">
      <!-- long rays (8) -->
      <line x1="0" y1="-78" x2="0" y2="-30" transform="rotate(0)"/>
      <line x1="0" y1="-78" x2="0" y2="-30" transform="rotate(45)"/>
      <line x1="0" y1="-78" x2="0" y2="-30" transform="rotate(90)"/>
      <line x1="0" y1="-78" x2="0" y2="-30" transform="rotate(135)"/>
      <line x1="0" y1="-78" x2="0" y2="-30" transform="rotate(180)"/>
      <line x1="0" y1="-78" x2="0" y2="-30" transform="rotate(225)"/>
      <line x1="0" y1="-78" x2="0" y2="-30" transform="rotate(270)"/>
      <line x1="0" y1="-78" x2="0" y2="-30" transform="rotate(315)"/>
    </g>
    <g stroke="url(#gold)" stroke-width="1.5" stroke-linecap="round" opacity="0.75">
      <!-- short rays (8) -->
      <line x1="0" y1="-64" x2="0" y2="-30" transform="rotate(22.5)"/>
      <line x1="0" y1="-64" x2="0" y2="-30" transform="rotate(67.5)"/>
      <line x1="0" y1="-64" x2="0" y2="-30" transform="rotate(112.5)"/>
      <line x1="0" y1="-64" x2="0" y2="-30" transform="rotate(157.5)"/>
      <line x1="0" y1="-64" x2="0" y2="-30" transform="rotate(202.5)"/>
      <line x1="0" y1="-64" x2="0" y2="-30" transform="rotate(247.5)"/>
      <line x1="0" y1="-64" x2="0" y2="-30" transform="rotate(292.5)"/>
      <line x1="0" y1="-64" x2="0" y2="-30" transform="rotate(337.5)"/>
    </g>

    <!-- center disc -->
    <circle r="14" fill="url(#gold)"/>
    <circle r="14" fill="none" stroke="#0a0f1c" stroke-width="1.5"/>
  </g>

  <!-- minimalist laurel accents flanking the sun -->
  <g stroke="url(#goldSoft)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M 560 260 Q 600 230 630 200 Q 610 225 600 250 Q 585 235 560 260"/>
    <path d="M 545 235 Q 585 205 615 175 Q 595 200 585 225 Q 570 210 545 235"/>
    <path d="M 535 210 Q 575 180 600 150 Q 580 175 570 200 Q 555 185 535 210"/>

    <path d="M 1024 260 Q 984 230 954 200 Q 974 225 984 250 Q 999 235 1024 260"/>
    <path d="M 1039 235 Q 999 205 969 175 Q 989 200 999 225 Q 1014 210 1039 235"/>
    <path d="M 1049 210 Q 1009 180 984 150 Q 1004 175 1014 200 Q 1029 185 1049 210"/>
  </g>

  <!-- developer identity, inscription-style typography -->
  <text x="792" y="66" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" letter-spacing="7" fill="url(#gold)">C / C++ DEVELOPER</text>
  <text x="792" y="94" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" letter-spacing="5" fill="#e9c766" opacity="0.65">SYSTEMS &amp; SOFTWARE ENGINEERING</text>

  <!-- thin gold frame lines top & bottom, minimalist -->
  <line x1="60" y1="40" x2="1524" y2="40" stroke="url(#gold)" stroke-width="1" opacity="0.35"/>
  <line x1="60" y1="356" x2="1524" y2="356" stroke="url(#gold)" stroke-width="1" opacity="0.35"/>

  <!-- corner ticks for a crisp, modern feel -->
  <g stroke="url(#gold)" stroke-width="2" opacity="0.7">
    <line x1="60" y1="40" x2="60" y2="70"/>
    <line x1="60" y1="40" x2="90" y2="40"/>

    <line x1="1524" y1="40" x2="1524" y2="70"/>
    <line x1="1524" y1="40" x2="1494" y2="40"/>

    <line x1="60" y1="356" x2="60" y2="326"/>
    <line x1="60" y1="356" x2="90" y2="356"/>

    <line x1="1524" y1="356" x2="1524" y2="326"/>
    <line x1="1524" y1="356" x2="1494" y2="356"/>
  </g>
</svg>
